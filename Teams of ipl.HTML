<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL Teams 2026 - ELITE Sports</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    img {
      display: block;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }

    ::-webkit-scrollbar-thumb {
      background: #10b981;
      border-radius: 3px;
    }

    /* ── Background Video (BRIGHTER & SHARPER) ── */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      transition: opacity 0.8s ease;
    }

    .bg-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.2) brightness(1.2) saturate(1.1);
    }

    .bg-video::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 10, 0.3);
    }

    .bg-video audio {
      display: none;
    }

    .page-content {
      position: relative;
      z-index: 1;
    }

    /* ── Glass ── */
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ── Gradient Text ── */
    .gradient-text {
      background: linear-gradient(135deg, #fff, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Animations ── */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      0% { opacity: 0; transform: translateX(60px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes scaleIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    .anim-blink {
      animation: blink 1.5s infinite;
    }

    .anim-bounce {
      animation: bounce 1.5s ease-in-out infinite;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .anim-up {
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .anim-slide {
      animation: slideIn 0.5s ease-out forwards;
    }

    .anim-scale {
      animation: scaleIn 0.3s ease-out forwards;
    }

    /* ══════════════════════════════════════════ */
    /* ── Navigation (EXACT COPY FROM FIRST PAGE) ── */
    /* ══════════════════════════════════════════ */
   .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border-bottom: none;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .nav.scrolled {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-links {
      display: none;
      gap: 8px;
    }

    .nav-link {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      border-radius: 9999px;
      transition: color 0.2s, background 0.2s;
    }

    .nav-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-icon-btn {
      position: relative;
      width: 40px;
      height: 40px;
      border: none;
      background: none;
      color: rgba(255, 255, 255, 0.7);
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
    }

    .nav-icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
    }

    .nav-btn {
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: box-shadow 0.3s, background 0.3s;
      white-space: nowrap;
    }

    .nav-login {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .nav-login:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .nav-signup {
      background: linear-gradient(to right, #10b981, #34d399);
      color: #000;
    }

    .nav-signup:hover {
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
    }

    .nav-menu-btn {
      display: none;
      width: 40px;
      height: 40px;
      border: none;
      background: none;
      color: rgba(255, 255, 255, 0.7);
      border-radius: 9999px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .nav-menu-btn:hover {
      color: #fff;
    }

    @media (min-width: 1024px) {
      .nav-links {
        display: flex;
      }
      .nav-login {
        display: block;
      }
    }

    @media (max-width: 1023px) {
      .nav-menu-btn {
        display: flex;
      }
      .nav-login {
        display: none;
      }
    }

    @media (max-width: 767px) {
      .nav-signup {
        display: none;
      }
    }

    /* ── Mobile Menu ── */
    .mob-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 60;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(24px);
      padding: 80px 24px 24px;
      display: none;
      flex-direction: column;
    }

    .mob-menu.open {
      display: flex;
    }

    .mob-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mob-link {
      padding: 16px;
      font-size: 18px;
      font-weight: 500;
      color: #a3a3a3;
      border-radius: 12px;
      transition: 0.2s;
    }

    .mob-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .mob-link.on {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .mob-btns {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .mob-btns .nav-btn {
      flex: 1;
      text-align: center;
      padding: 14px;
      font-size: 15px;
    }

    /* ── Search Bar ── */
    .search-bar {
      position: fixed;
      top: 64px;
      left: 0;
      width: 100%;
      z-index: 45;
      padding: 16px 24px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: none;
    }

    .search-bar.open {
      display: block;
    }

    .search-inner {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-input::placeholder {
      color: #737373;
    }

    .search-input:focus {
      border-color: rgba(16, 185, 129, 0.5);
    }

    .search-icon-left {
      position: absolute;
      top: 50%;
      left: 18px;
      transform: translateY(-50%);
      color: #737373;
    }

    .search-results {
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      display: none;
    }

    .search-results.show {
      display: block;
    }

    .search-result-item {
      padding: 14px 20px;
      font-size: 14px;
      color: #d4d4d4;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .search-result-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .search-no-result {
      padding: 20px;
      text-align: center;
      color: #737373;
      font-size: 14px;
    }

    /* ── Notification Popup (EXACT COPY) ── */
    .notif-popup {
      position: fixed;
      top: 64px;
      right: 24px;
      width: 340px;
      z-index: 55;
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      display: none;
    }

    .notif-popup.open {
      display: block;
    }

    .notif-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .notif-header-title {
      font-weight: 600;
      font-size: 15px;
    }

    .notif-header-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
    }

    .notif-item {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s;
      cursor: pointer;
    }

    .notif-item:last-child {
      border-bottom: none;
    }

    .notif-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .notif-item-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .notif-item-time {
      font-size: 12px;
      color: #737373;
    }

    .notif-item-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #34d399;
      border-radius: 50%;
      margin-right: 8px;
    }

    @media (max-width: 400px) {
      .notif-popup {
        right: 8px;
        left: 8px;
        width: auto;
      }
    }

    /* ── Auth Modal (EXACT COPY) ── */
    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-overlay.open {
      display: flex;
    }

    .auth-modal {
      width: 100%;
      max-width: 420px;
      background: #141414;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      overflow: hidden;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .auth-tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: #737373;
      cursor: pointer;
      transition: color 0.2s;
      background: none;
      border: none;
    }

    .auth-tab.active {
      color: #fff;
      border-bottom: 2px solid #10b981;
    }

    .auth-tab:hover {
      color: #d4d4d4;
    }

    .auth-body {
      padding: 32px 24px;
    }

    .auth-field {
      margin-bottom: 16px;
    }

    .auth-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #a3a3a3;
      margin-bottom: 6px;
    }

    .auth-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .auth-input::placeholder {
      color: #525252;
    }

    .auth-input:focus {
      border-color: rgba(16, 185, 129, 0.5);
    }

    .auth-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(to right, #10b981, #34d399);
      color: #000;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: box-shadow 0.3s;
      margin-top: 8px;
    }

    .auth-submit:hover {
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
    }

    .auth-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-modal-wrap {
      position: relative;
    }

    .auth-msg {
      text-align: center;
      font-size: 14px;
      margin-top: 16px;
      display: none;
    }

    .auth-msg.show {
      display: block;
    }

    .auth-msg.success {
      color: #34d399;
    }

    /* ══════════════════════════════════════════ */
    /* ── LOGO (EXACT COPY FROM FIRST PAGE) ── */
    /* ══════════════════════════════════════════ */
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .logo img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* ══════════════════════════════════════════ */
    /* ── TEAMS PAGE SPECIFIC STYLES ── */
    /* ══════════════════════════════════════════ */

    /* ── Hero ── */
    .hero {
      padding: 120px 24px 40px;
      text-align: center;
    }

    .hero-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(to right, #fb923c, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media (min-width: 768px) {
      .hero-title {
        font-size: 56px;
      }
    }

    .hero-sub {
      font-size: 16px;
      color: #737373;
    }

    /* ── Container ── */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── Team Grid ── */
    .team-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      padding-bottom: 80px;
    }

    @media (min-width: 640px) {
      .team-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .team-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .team-card {
      position: relative;
      height: 300px;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.5s ease;
    }

    .team-card:hover {
      transform: translateY(-6px);
    }

    .team-card-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.5);
      transition: transform 0.6s ease, filter 0.6s ease;
    }

    .team-card:hover .team-card-bg {
      transform: scale(1.1);
      filter: brightness(0.7);
    }

    .team-card-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, transparent);
    }

    .team-card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      border-left: 4px solid;
    }

    .team-card-name {
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .team-card-short {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    /* ── Team View ── */
    .team-view {
      display: none;
      padding-bottom: 80px;
    }

    .team-view.show {
      display: block;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #a3a3a3;
      font-size: 14px;
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
      margin-bottom: 32px;
      transition: color 0.2s, background 0.2s;
    }

    .back-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
    }

    .team-header-title {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    @media (min-width: 768px) {
      .team-header-title {
        font-size: 48px;
      }
    }

    .team-header-sub {
      font-size: 14px;
      color: #737373;
      margin-bottom: 40px;
    }

    /* ── Player Grid ── */
    .player-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 640px) {
      .player-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 768px) {
      .player-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .player-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .player-card {
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .player-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }

    .player-card img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
    }

    .player-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, transparent);
      pointer-events: none;
    }

    .player-card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
    }

    .player-role {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #f60000;
    }

    .player-name {
      font-size: 20px;
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-weight: 700;
      color: rgb(8, 8, 8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-captain {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      background: #fbbf24;
      color: #000;
      border-radius: 6px;
    }

    /* ── Modal ── */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal.show {
      opacity: 1;
      visibility: visible;
    }

    .modal img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 16px;
    }

    .modal-close {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 110;
      width: 48px;
      height: 48px;
      border: none;
      background: rgba(251, 248, 248, 0.1);
      color: #fff;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .modal-close:hover {
      background: #ef4444;
    }

    .hidden {
      display: none !important;

    var currentTeam = null;

    // Build team grid
    function buildGrid() {
      var grid = document.getElementById('teamsGrid');
      grid.innerHTML = '';

      for (var i = 0; i < teams.length; i++) {
        var t = teams[i];
        var card = document.createElement('div');
        card.className = 'team-card anim-up';
        card.style.animationDelay = (i * 0.06) + 's';
        card.onclick = (function(team) {
          return function() { showTeam(team); };
        })(t);

        card.innerHTML =
          '<div class="team-card-bg" style="background-image:url(' + t.img + ')"></div>' +
          '<div class="team-card-gradient"></div>' +
          '<div class="team-card-info" style="border-color:' + t.color + '">' +
            '<h3 class="team-card-name">' + t.name + '</h3>' +
            '<p class="team-card-short" style="color:' + t.color + '">' + t.short + '</p>' +
          '</div>';

        grid.appendChild(card);
      }
    }

    // Show team players
    function showTeam(team) {
      currentTeam = team;
      document.getElementById('teamsGrid').style.display = 'none';
      var view = document.getElementById('teamView');
      view.className = 'team-view show anim-slide';

      // Switch video + audio
      switchMedia(team.id);

      document.getElementById('teamHeader').innerHTML =
        '<h2 class="team-header-title" style="color:' + team.color + '">' + team.name + '</h2>' +
        '<p class="team-header-sub">IPL 2026 Squad &bull; ' + team.players.length + ' Players</p>';

      var grid = document.getElementById('playersGrid');
      grid.innerHTML = '';

      for (var i = 0; i < team.players.length; i++) {
        var p = team.players[i];
        var card = document.createElement('div');
        card.className = 'player-card anim-up';
        card.style.animationDelay = (i * 0.03) + 's';
        card.style.position = 'relative';
        card.onclick = (function(img) {
          return function() { openModal(img); };
        })(p.img);

        card.innerHTML =
          '<img src="' + p.img + '" alt="' + p.name + '">' +
          '<div class="player-card-overlay"></div>' +
          '<div class="player-card-info">' +
            '<p class="player-role">' + p.role + '</p>' +
            '<h3 class="player-name">' + p.name + '</h3>' +
          '</div>' +
          (p.c ? '<div class="player-captain">C</div>' : '');

        grid.appendChild(card);
      }
    }

    // Switch video and audio
    function switchMedia(teamId) {
      var allVids = document.querySelectorAll('.bg-video');
      for (var i = 0; i < allVids.length; i++) {
        var v = allVids[i].querySelector('video');
        var a = allVids[i].querySelector('audio');
        if (v) v.pause();
        if (a) { a.pause(); a.currentTime = 0; }
        allVids[i].style.opacity = '0';
        allVids[i].style.pointerEvents = 'none';
      }

      var target = document.getElementById('vid-' + teamId);
      if (target) {
        target.style.opacity = '1';
        target.style.pointerEvents = 'auto';
        var vid = target.querySelector('video');
        var aud = target.querySelector('audio');
        if (vid) vid.play();
        if (aud) {
          aud.volume = 0.15;
          aud.play();
        }
      }
    }

    // Stop all media
    function stopAllMedia() {
      var allVids = document.querySelectorAll('.bg-video');
      for (var i = 0; i < allVids.length; i++) {
        var v = allVids[i].querySelector('video');
        var a = allVids[i].querySelector('audio');
        if (v) v.pause();
        if (a) { a.pause(); a.currentTime = 0; }
        allVids[i].style.opacity = '0';
        allVids[i].style.pointerEvents = 'none';
      }
    }

    // Go back
    function goBack() {
      currentTeam = null;
      stopAllMedia();
      document.getElementById('teamView').className = 'team-view';
      document.getElementById('teamsGrid').style.display = '';
    }

    // Modal
    function openModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('playerModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('playerModal').classList.remove('show');
    }

    // Init
    buildGrid();
  </script>
